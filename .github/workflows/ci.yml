name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        run: |
          command -v shellcheck || sudo apt-get install -y shellcheck
          shellcheck --version
          shellcheck bin/vscode-tutor test/smoke.sh

  smoke:
    name: Smoke test (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # 利用者の多くは macOS 標準の bash 3.2 で実行する
      - name: Smoke test (macOS system bash 3.2)
        run: |
          export PATH="/bin:/usr/bin:$PATH"
          bash -c 'echo "bash $BASH_VERSION ($BASH)"; [ "${BASH_VERSINFO[0]}" -eq 3 ]'
          test/smoke.sh
      # Homebrew の bash を PATH の先頭に置いている人向け（ランナーには入っていないので入れる）
      - name: Smoke test (Homebrew bash 5)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install bash
          brew_prefix="$(brew --prefix)"
          export PATH="$brew_prefix/bin:$PATH"
          bash -c 'echo "bash $BASH_VERSION ($BASH)"; [ "${BASH_VERSINFO[0]}" -ge 5 ]'
          test/smoke.sh
